<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="San Provider System">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="San Provider System">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>San Provider System</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    const notificationClicks = [];
    let notificationClickHandler = null;
    function deliverNotificationClick(payload) {
      const encoded = JSON.stringify(payload);
      if (notificationClickHandler) notificationClickHandler(encoded);
      else notificationClicks.push(encoded);
    }
    navigator.serviceWorker?.addEventListener('message', function (event) {
      if (event.data?.type === 'SUN_NOTIFICATION_CLICK') {
        deliverNotificationClick(event.data.payload);
      }
    });
    const launchUrl = new URL(window.location.href);
    const launchNotification = launchUrl.searchParams.get('notificationClick');
    if (launchNotification) {
      try { deliverNotificationClick(JSON.parse(launchNotification)); } catch (_) {}
      launchUrl.searchParams.delete('notificationClick');
      history.replaceState(history.state, '', launchUrl);
    }
    window.registerNotificationClickHandler = function (handler) {
      notificationClickHandler = handler;
      if (handler) {
        while (notificationClicks.length) handler(notificationClicks.shift());
      }
    };
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' }).catch(function (error) {
          console.warn('Firebase Messaging Service Worker registration failed: ', error);
        });
      });
    }

    window.showBrowserNotification = function(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'granted') {
        try {
          new Notification(title, { body: body, icon: '/favicon.png' });
        } catch (e) {
          console.warn('Notification display failed: ', e);
        }
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') {
            try {
              new Notification(title, { body: body, icon: '/favicon.png' });
            } catch (e) {
              console.warn('Notification display failed: ', e);
            }
          }
        });
      }
    };
  </script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
